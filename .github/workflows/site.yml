name: Landing page

# Deploys site/ (lares.thocode.dev) as the Cloudflare Worker `lares-site`. Only `main` deploys; a pull
# request that touches site/ gets a dry run (config + assets checked, nothing uploaded, no token needed).
# Needs the repository secrets CLOUDFLARE_API_TOKEN (Workers Scripts: Edit) and CLOUDFLARE_ACCOUNT_ID.
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', '.github/workflows/site.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: false

env:
  WRANGLER: wrangler@4.147.0

jobs:
  check:
    name: Dry run
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: wrangler deploy --dry-run
        working-directory: site
        run: npx --yes "$WRANGLER" deploy --dry-run

  deploy:
    name: Deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: wrangler deploy
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes "$WRANGLER" deploy
      - name: Smoke test
        run: |
          test "$(curl -s -o /dev/null -w '%{http_code}' https://lares.thocode.dev/)" = 200
          curl -sI https://lares.thocode.dev/install | grep -qi '^location: .*install.sh'
